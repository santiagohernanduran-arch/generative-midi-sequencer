# Indicates, by default, whether the application is built using AndroidX.
android.useAndroidX=true

# Automatically import AndroidX support for libraries.
android.enableJetifier=true

# Enable Kotlin coroutines support.
kotlin.code.style=official

# Specifies the JVM arguments used for the Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Fuerza al daemon de Gradle a usar JDK 17.
# Gradle 8.10.2 y AGP 8.7.3 NO soportan Java 25 (el JBR de Android Studio),
# por eso se fija manualmente una JDK compatible.
# NOTA: si instalas/cambias este JDK de lugar, ajusta esta ruta.
org.gradle.java.home=C:/Program Files/Java/jdk-17
